<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajj Volunteer Salsabeel 2026</title>
    <link rel="icon" type="image/x-icon" href="images/Volunteer-logo.png">
    <!-- Bulma CSS + Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div style="position: absolute; top: 1rem; right: 1rem; z-index: 100;">
        <button id="themeToggleBtn" class="button is-light is-rounded" aria-label="Toggle Dark Mode">
            <span class="icon"><i class="fas fa-moon" id="themeIcon"></i></span>
        </button>
    </div>
    <section class="hero is-primary is-bold">
        <div class="hero-body">
            <div class="container has-text-centered-mobile">
                <div class="hero-logo">
                    <img src="images/Volunteer-logo.png" alt="Volunteer logo" onerror="this.style.display='none'">
                </div>
                <h1 class="title is-2">Volunteer Registration</h1>
                <p class="subtitle is-5">Hajj Volunteer Salsabeel 2026</p>
            </div>
        </div>
    </section>

    <div class="container mb-6">
        <div class="card-form">
            <form id="volunteerForm" novalidate>
                <div class="columns is-multiline">
                    <!-- Full name -->
                    <div class="column is-6 field">
                        <label class="label required-star">Full Name</label>
                        <div class="control has-icons-left">
                            <input class="input" type="text" name="fullName" placeholder="e.g., Al Mamun Hossen"
                                required autocomplete="name">
                            <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
                        </div>
                    </div>

                    <!-- ID number -->
                    <div class="column is-6 field">
                        <label class="label required-star">ID Number</label>
                        <div class="control has-icons-left">
                            <input class="input" type="text" name="idNumber" placeholder="10-digit ID" required
                                pattern="\d{10}" title="Must be exactly 10 digits" maxlength="10">
                            <span class="icon is-small is-left"><i class="fas fa-id-card"></i></span>
                        </div>
                    </div>

                    <!-- City Name -->
                    <div class="column is-6 field">
                        <label class="label required-star">City Name</label>
                        <div class="control has-icons-left">
                            <div class="select is-fullwidth">
                                <select name="cityName" id="cityName" required>
                                    <option value="" disabled selected>– Select city –</option>
                                    <option value="Jeddah">Jeddah</option>
                                    <option value="Makkah">Makkah</option>
                                    <option value="Medina">Medina</option>
                                    <option value="Dammam">Dammam</option>
                                    <option value="Riyadh">Riyadh</option>
                                    <option value="Tabuk">Tabuk</option>
                                    <option value="Abha">Abha</option>
                                    <option value="Taif">Taif</option>
                                </select>
                            </div>
                            <span class="icon is-small is-left"><i class="fas fa-city"></i></span>
                        </div>
                    </div>

                    <!-- Profile photo (required) -->
                    <div class="column is-6 field">
                        <label class="label required-star">Profile Photo</label>
                        <div class="control is-flex is-align-items-center is-flex-wrap-wrap profile-photo-row">
                            <div class="file has-name is-fullwidth mr-2 mb-2-mobile">
                                <label class="file-label">
                                    <input class="file-input" type="file" name="theFile" id="profilePhoto"
                                        accept="image/jpeg, image/png, image/jpg, image/webp" required>
                                    <span class="file-cta">
                                        <span class="file-icon"><i class="fas fa-upload"></i></span>
                                        <span class="file-label">Choose a photo…</span>
                                    </span>
                                    <span class="file-name" id="fileNameDisplay">No file selected</span>
                                </label>
                            </div>
                            <button type="button" id="takePhotoBtn" class="button is-info is-light take-photo-btn-mobile" title="Take a photo with your camera">
                                <span class="icon is-medium"><i class="fas fa-camera"></i></span>
                                <span>Take Photo</span>
                            </button>
                        </div>
                        <!-- Camera modal -->
                        <div id="cameraModal" class="modal">
                            <div class="modal-background"></div>
                            <div class="modal-card camera-modal-card">
                                <header class="modal-card-head camera-modal-head">
                                    <p class="modal-card-title">Take a Photo</p>
                                    <button class="delete" aria-label="close" id="closeCameraModal"></button>
                                </header>
                                <section class="modal-card-body camera-modal-body">
                                    <video id="cameraStream" autoplay playsinline width="320" height="240" class="camera-video"></video>
                                    <canvas id="cameraCanvas" width="320" height="240" style="display:none;"></canvas>
                                </section>
                                <footer class="modal-card-foot camera-modal-foot">
                                    <button class="button is-primary is-large" id="capturePhotoBtn" style="width: 100%; max-width: 320px;">Capture</button>
                                </footer>
                            </div>
                        </div>
                        <style>
                        /* Camera modal theme matching and mobile optimization */
                        .camera-modal-card {
                            width: 400px;
                            max-width: 95vw;
                            background: var(--background, #fff);
                            color: var(--text, #222);
                            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                        }
                        .camera-modal-head, .camera-modal-foot {
                            background: inherit;
                            color: inherit;
                        }
                        .camera-modal-body {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            background: inherit;
                            padding: 1rem 0.5rem;
                        }
                        .camera-video {
                            border-radius: 8px;
                            background: var(--video-bg, #222);
                            width: 100%;
                            max-width: 320px;
                            height: auto;
                            aspect-ratio: 4/3;
                        }
                        .profile-photo-row {
                            gap: 0.5rem;
                        }
                        .take-photo-btn-mobile {
                            min-width: 120px;
                            font-size: 1.1rem;
                            padding: 0.75em 1.25em;
                        }
                        @media (max-width: 600px) {
                            .file.has-name .file-label {
                        width: 83%;
                            }
                            .camera-modal-card {
                                width: 98vw;
                                min-width: unset;
                                max-width: 98vw;
                            }
                            .camera-modal-body {
                                padding: 0.5rem 0.1rem;
                            }
                            .camera-video {
                                max-width: 98vw;
                                width: 98vw;
                                height: auto;
                            }
                            .profile-photo-row {
                                align-items: stretch;
                                gap: 0.5rem;
                            }
                            .mb-2-mobile {
                                margin-bottom: 0.5rem !important;
                            }
                            .take-photo-btn-mobile {
                                width: 100%;
                                min-width: unset;
                                font-size: 1.15rem;
                            }
                        }
                        html[data-theme='dark'] .camera-modal-card,
                        body[data-theme='dark'] .camera-modal-card {
                            --background: #23272f;
                            --text: #f5f5f5;
                            --video-bg: #111;
                        }
                        html:not([data-theme='dark']) .camera-modal-card,
                        body:not([data-theme='dark']) .camera-modal-card {
                            --background: #fff;
                            --text: #222;
                            --video-bg: #eee;
                        }
                        </style>
                        <div id="previewArea" class="preview-container" style="display: none;">
                            <img id="previewImg" class="image-preview" alt="Preview">
                            <div>
                                <p class="is-size-7 has-text-weight-semibold mb-2" id="previewName">filename.jpg</p>
                                <button type="button" id="clearPhotoBtn" class="button is-small is-light"><i
                                        class="fas fa-times mr-1"></i> Remove</button>
                            </div>
                        </div>
                        <p class="help">JPEG, PNG, WEBP (max 5MB)</p>
                    </div>

                    <!-- Mobile -->
                    <div class="column is-6 field">
                        <label class="label required-star">Mobile Number</label>
                        <div class="control has-icons-left">
                            <input class="input" type="tel" name="mobile" placeholder="+966 5X XXX XXXX" required
                                pattern="[+0-9\s\-\(\)]{8,20}" title="Valid phone number">
                            <span class="icon is-small is-left"><i class="fas fa-phone"></i></span>
                        </div>
                        <p class="help">Include country code</p>
                    </div>

                    <!-- Blood group -->
                    <div class="column is-6 field">
                        <label class="label required-star">Blood Group</label>
                        <div class="control has-icons-left">
                            <div class="select is-fullwidth">
                                <select name="bloodGroup" required>
                                    <option value="" disabled selected>– Select blood type –</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                </select>
                            </div>
                            <span class="icon is-small is-left"><i class="fas fa-tint"></i></span>
                        </div>
                    </div>
                </div>

                <!-- Additional information -->
                <div class="field mt-4">
                    <label class="label">Additional Information <span
                            class="has-text-grey-light">(Optional)</span></label>
                    <div class="control has-icons-left">
                        <textarea class="textarea" name="additionalInfo" rows="3"
                            placeholder="Medical conditions, availability, previous donation experience..."
                            style="padding-left: 3.2rem;"></textarea>
                        <span class="icon is-small is-left"
                            style="height: 3.2rem; display: flex; align-items: center; justify-content: center;"><i
                                class="fas fa-comment-dots"></i></span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="field is-grouped is-grouped-right mt-6 pt-4"
                    style="border-top: 1px solid var(--border-color);">
                    <div class="control">
                        <button class="button is-light" type="button" id="cancelBtn">
                            <span class="icon"><i class="fas fa-undo-alt"></i></span>
                            <span>Clear</span>
                        </button>
                    </div>
                    <div class="control">
                        <button class="button is-primary" type="submit" id="submitBtn">
                            <span class="icon"><i class="fas fa-paper-plane"></i></span>
                            <span>Register Now</span>
                        </button>
                    </div>
                </div>
            </form>
            <p class="help is-danger mt-4 has-text-centered">* Required fields must be completed before submitting.</p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
    <footer class="footer-pro">
        <div class="footer-content">
            <p>&copy; 2026 Hajj Volunteer Salsabeel. All rights reserved.</p>
            <p>Developed with <span class="footer-heart"><i class="fas fa-heart"></i></span> by <a
                    href="https://www.almamunhossen.com" target="_blank" rel="noopener noreferrer">Al Mamun Hossen</a>
            </p>
        </div>
    </footer>
</body>

</html>
